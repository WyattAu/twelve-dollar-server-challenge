[workspace]
resolver = "3"
members = ["crates/sqlite-btree", "crates/sqlite-ffi", "crates/uring-http", "server"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/uring-http-kit"

[workspace.dependencies]
io-uring = "0.7"
libc = "0.2"
proptest = "1"
memmap2 = "0.9"
rusqlite = { version = "0.32", default-features = false }
uring-kit = "0.1.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
